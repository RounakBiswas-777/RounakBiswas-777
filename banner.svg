<svg width="850" height="320" viewBox="0 0 850 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Studio Obsidian Base -->
    <linearGradient id="bgBase" x1="0" y1="0" x2="850" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B1122"/>
      <stop offset="100%" stop-color="#070B15"/>
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="orbRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#E11D48" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.46"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <!-- Editorial Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="74%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Generative Art Ribbon Gradients -->
    <linearGradient id="artStroke1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="artStroke2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="artStroke3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="frameBorder" x1="0" y1="0" x2="850" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.75"/>
    </linearGradient>

    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94A3B8" fill-opacity="0.16"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="846" height="316" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Canvas & Subtle Dot Grid -->
    <rect x="2" y="2" width="846" height="316" rx="22" fill="url(#bgBase)"/>
    <rect x="2" y="2" width="846" height="316" fill="url(#dotGrid)"/>

    <!-- Aurora Mesh Glows (GitHub-Safe Native SVG Animate) -->
    <circle cx="690" cy="110" r="215" fill="url(#orbRose)">
      <animate attributeName="r" values="205;232;205" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="160" cy="270" r="225" fill="url(#orbCyan)">
      <animate attributeName="r" values="215;242;215" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="550" cy="245" r="195" fill="url(#orbIndigo)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="420" cy="40" r="150" fill="url(#orbEmerald)">
      <animate attributeName="r" values="140;168;140" dur="6.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Ambient Starfield -->
    <circle cx="470" cy="64" r="2.2" fill="#38BDF8">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="276" r="2" fill="#FB7185">
      <animate attributeName="opacity" values="0.95;0.25;0.95" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="46" r="1.8" fill="#34D399">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="812" cy="264" r="2.2" fill="#C084FC">
      <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Right-Side Generative Art Sculpture -->
    <g opacity="0.95">
      <!-- Outer Dashed Orbit -->
      <circle cx="690" cy="168" r="100" stroke="#38BDF8" stroke-opacity="0.34" stroke-width="1.4" stroke-dasharray="8 8">
        <animateTransform attributeName="transform" type="rotate" from="360 690 168" to="0 690 168" dur="28s" repeatCount="indefinite"/>
      </circle>

      <!-- Inner Dashed Orbit -->
      <circle cx="690" cy="168" r="68" stroke="#F43F5E" stroke-opacity="0.36" stroke-width="1.3" stroke-dasharray="18 10">
        <animateTransform attributeName="transform" type="rotate" from="0 690 168" to="360 690 168" dur="18s" repeatCount="indefinite"/>
      </circle>

      <!-- Core Ring -->
      <circle cx="690" cy="168" r="36" stroke="#818CF8" stroke-opacity="0.28" stroke-width="1"/>

      <!-- 3 Layered Bezier Brush Ribbons -->
      <path d="M548 250 C592 106, 666 64, 728 148 C768 202, 796 160, 826 82" stroke="url(#artStroke1)" stroke-width="3.2" stroke-linecap="round" fill="none">
        <animate attributeName="opacity" values="0.72;1;0.72" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M574 82 C638 144, 648 254, 738 228 C786 214, 806 174, 820 140" stroke="url(#artStroke2)" stroke-width="2.4" stroke-linecap="round" fill="none">
        <animate attributeName="opacity" values="1;0.68;1" dur="5.2s" repeatCount="indefinite"/>
      </path>
      <path d="M598 268 C650 202, 704 114, 788 118" stroke="url(#artStroke3)" stroke-width="1.8" stroke-linecap="round" fill="none">
        <animate attributeName="opacity" values="0.65;0.98;0.65" dur="3.9s" repeatCount="indefinite"/>
      </path>

      <!-- Vector Anchor Nodes -->
      <line x1="622" y1="126" x2="684" y2="162" stroke="#94A3B8" stroke-opacity="0.42" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="622" cy="126" r="5" fill="#F43F5E"/>
      <rect x="683" y="161" width="14" height="14" rx="3.5" fill="#060911" stroke="#38BDF8" stroke-width="2.2"/>
      <circle cx="746" cy="224" r="4.8" fill="#34D399"/>
      <circle cx="746" cy="224" r="9.5" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.2"/>
    </g>

    <!-- Rotating Editorial Star Emblem -->
    <path d="M788 40 L791.5 50.5 L802 54 L791.5 57.5 L788 68 L784.5 57.5 L774 54 L784.5 50.5 Z" fill="#F8FAFC" fill-opacity="0.92">
      <animateTransform attributeName="transform" type="rotate" from="0 788 54" to="360 788 54" dur="14s" repeatCount="indefinite"/>
    </path>

    <!-- Top Badge Pill -->
    <rect x="46" y="38" width="276" height="30" rx="15" fill="#0F172A" fill-opacity="0.92" stroke="#334155" stroke-width="1.2"/>
    <circle cx="65" cy="53" r="4.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="57" fill="#CBD5E1" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.4">ARTIST ✦ CS &amp; TECHNOLOGY</text>

    <!-- Main Hero Typography -->
    <text x="46" y="148" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.2">Rounak Biswas</text>
    <text x="48" y="186" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18.5" font-weight="500" letter-spacing="0.3">Visual Artist  •  Creative Developer  •  Computer Science &amp; Tech</text>

    <!-- Accent Divider Line -->
    <rect x="48" y="212" width="128" height="3.2" rx="1.6" fill="url(#artStroke1)"/>

    <!-- Artist Motto -->
    <text x="48" y="252" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" font-weight="600" letter-spacing="0.2">“Code is my medium. Design is my language.”</text>

    <!-- Core Pillars Line -->
    <text x="48" y="284" fill="#64748B" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600" letter-spacing="1">REACT • JAVA • PYTHON • C • LINUX • CLOUD • AI</text>
  </g>

  <!-- Crisp Outer Frame -->
  <rect x="2" y="2" width="846" height="316" rx="22" stroke="url(#frameBorder)" stroke-width="1.8" fill="none"/>
</svg>
