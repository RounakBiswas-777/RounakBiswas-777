<svg width="850" height="320" viewBox="0 0 850 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="850" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B1122"/>
      <stop offset="100%" stop-color="#070B15"/>
    </linearGradient>

    <radialGradient id="orbRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#E11D48" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.46"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="74%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <linearGradient id="artStroke1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="artStroke2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="artStroke3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="frameBorder" x1="0" y1="0" x2="850" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="heroSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94A3B8" fill-opacity="0.16"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="846" height="316" rx="22"/>
    </clipPath>
  </defs>

  <style>
    /* Smooth Liquid Aurora Motion */
    .orb-1 { animation: floatA 8.5s ease-in-out infinite; transform-origin: 690px 110px; }
    .orb-2 { animation: floatB 10.5s ease-in-out infinite; transform-origin: 160px 270px; }
    .orb-3 { animation: floatA 12.5s ease-in-out infinite reverse; transform-origin: 550px 245px; }
    .orb-4 { animation: floatB 9.5s ease-in-out 1.5s infinite; transform-origin: 420px 60px; }

    /* Diagonal Glass Sheen Sweep */
    .sheen-sweep {
      animation: sweepAcross 6.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Generative Bezier Brush Strokes */
    .art-draw-1 {
      stroke-dasharray: 560;
      stroke-dashoffset: 560;
      animation: drawLoop 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .art-draw-2 {
      stroke-dasharray: 480;
      stroke-dashoffset: 480;
      animation: drawLoop 7s cubic-bezier(0.4, 0, 0.2, 1) 1.1s infinite;
    }
    .art-draw-3 {
      stroke-dasharray: 380;
      stroke-dashoffset: 380;
      animation: drawLoop 5.5s cubic-bezier(0.4, 0, 0.2, 1) 2.2s infinite;
    }

    /* Astrolabe & Particle Motion */
    .spin-star { transform-origin: 788px 54px; animation: spinSlow 14s linear infinite; }
    .orbit-outer { transform-origin: 690px 168px; animation: spinSlow 24s linear infinite reverse; }
    .orbit-inner { transform-origin: 690px 168px; animation: spinSlow 16s linear infinite; }
    .node-bob { animation: bobSlow 4s ease-in-out infinite; }
    .node-bob-2 { animation: bobSlow 4.8s ease-in-out 1.2s infinite; }
    .pulse-dot { animation: pulseGlow 2s ease-in-out infinite; }
    .twinkle-1 { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle-2 { animation: twinkle 4.1s ease-in-out 1.3s infinite; }
    .twinkle-3 { animation: twinkle 2.8s ease-in-out 0.6s infinite; }

    /* Staggered Editorial Entrance Transitions */
    .enter-1 { animation: slideFade 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both; }
    .enter-2 { animation: slideFade 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
    .enter-3 { animation: slideFade 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both; }
    .enter-4 { animation: slideFade 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both; }
    .bar-expand {
      transform-origin: 48px 212px;
      animation: expandBar 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both, barBreathe 4s ease-in-out 1.5s infinite;
    }

    @keyframes floatA {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-26px, 18px) scale(1.1); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(28px, -20px) scale(1.08); }
    }
    @keyframes sweepAcross {
      0% { transform: translateX(-380px) skewX(-22deg); opacity: 0; }
      18% { opacity: 1; }
      55% { transform: translateX(1080px) skewX(-22deg); opacity: 1; }
      65%, 100% { transform: translateX(1080px) skewX(-22deg); opacity: 0; }
    }
    @keyframes drawLoop {
      0% { stroke-dashoffset: 560; opacity: 0.2; }
      42% { stroke-dashoffset: 0; opacity: 1; }
      72% { stroke-dashoffset: 0; opacity: 0.92; }
      100% { stroke-dashoffset: -560; opacity: 0.2; }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes bobSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.95; }
    }
    @keyframes slideFade {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes expandBar {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }
    @keyframes barBreathe {
      0%, 100% { opacity: 1; transform: scaleX(1); }
      50% { opacity: 0.72; transform: scaleX(1.15); }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="846" height="316" rx="22" fill="url(#bgBase)"/>
    <rect x="2" y="2" width="846" height="316" fill="url(#dotGrid)"/>

    <!-- Breathing Aurora Mesh -->
    <circle class="orb-1" cx="690" cy="110" r="215" fill="url(#orbRose)"/>
    <circle class="orb-2" cx="160" cy="270" r="225" fill="url(#orbCyan)"/>
    <circle class="orb-3" cx="550" cy="245" r="195" fill="url(#orbIndigo)"/>
    <circle class="orb-4" cx="420" cy="40" r="150" fill="url(#orbEmerald)"/>

    <!-- Twinkling Ambient Starfield -->
    <circle class="twinkle-1" cx="470" cy="64" r="2.2" fill="#38BDF8"/>
    <circle class="twinkle-2" cx="520" cy="276" r="2" fill="#FB7185"/>
    <circle class="twinkle-3" cx="610" cy="46" r="1.8" fill="#34D399"/>
    <circle class="twinkle-1" cx="812" cy="264" r="2.2" fill="#C084FC"/>

    <!-- Right-Side Kinetic Generative Art Sculpture -->
    <g opacity="0.95">
      <circle class="orbit-outer" cx="690" cy="168" r="100" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1.4" stroke-dasharray="8 8"/>
      <circle class="orbit-inner" cx="690" cy="168" r="68" stroke="#F43F5E" stroke-opacity="0.34" stroke-width="1.3" stroke-dasharray="18 10"/>
      <circle cx="690" cy="168" r="36" stroke="#818CF8" stroke-opacity="0.25" stroke-width="1"/>

      <!-- 3 Layered Animated Bezier Ribbons -->
      <path class="art-draw-1" d="M548 250 C592 106, 666 64, 728 148 C768 202, 796 160, 826 82" stroke="url(#artStroke1)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <path class="art-draw-2" d="M574 82 C638 144, 648 254, 738 228 C786 214, 806 174, 820 140" stroke="url(#artStroke2)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path class="art-draw-3" d="M598 268 C650 202, 704 114, 788 118" stroke="url(#artStroke3)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Floating Vector Anchor Nodes -->
      <g class="node-bob">
        <line x1="622" y1="126" x2="684" y2="162" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="622" cy="126" r="5" fill="#F43F5E"/>
        <rect x="683" y="161" width="14" height="14" rx="3.5" fill="#060911" stroke="#38BDF8" stroke-width="2.2"/>
      </g>
      <g class="node-bob-2">
        <circle cx="746" cy="224" r="4.8" fill="#34D399"/>
        <circle cx="746" cy="224" r="9.5" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.2"/>
      </g>
    </g>

    <!-- Rotating Editorial Star Emblem -->
    <g class="spin-star">
      <path d="M788 40 L791.5 50.5 L802 54 L791.5 57.5 L788 68 L784.5 57.5 L774 54 L784.5 50.5 Z" fill="#F8FAFC" fill-opacity="0.9"/>
    </g>

    <!-- Staggered Animated Typography -->
    <g class="enter-1">
      <rect x="46" y="38" width="276" height="30" rx="15" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
      <circle class="pulse-dot" cx="65" cy="53" r="4.5" fill="#34D399"/>
      <text x="80" y="57" fill="#CBD5E1" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.4">ARTIST ✦ CS &amp; TECHNOLOGY</text>
    </g>

    <g class="enter-2">
      <text x="46" y="148" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.2">Rounak Biswas</text>
      <text x="48" y="186" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18.5" font-weight="500" letter-spacing="0.3">Visual Artist  •  Creative Developer  •  Computer Science &amp; Tech</text>
    </g>

    <rect class="bar-expand" x="48" y="212" width="128" height="3.2" rx="1.6" fill="url(#artStroke1)"/>

    <g class="enter-3">
      <text x="48" y="252" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" font-weight="600" letter-spacing="0.2">“Code is my medium. Design is my language.”</text>
    </g>

    <g class="enter-4">
      <text x="48" y="284" fill="#64748B" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600" letter-spacing="1">REACT • JAVA • PYTHON • C • LINUX • CLOUD • AI</text>
    </g>

    <!-- Luxury Diagonal Light Sweep -->
    <rect class="sheen-sweep" x="0" y="0" width="220" height="320" fill="url(#heroSheen)"/>
  </g>

  <rect x="2" y="2" width="846" height="316" rx="22" stroke="url(#frameBorder)" stroke-width="1.8" fill="none"/>
</svg>