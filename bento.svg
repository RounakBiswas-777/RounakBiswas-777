<svg width="850" height="360" viewBox="0 0 850 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Glass Card Surface -->
    <linearGradient id="glassCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#080C17" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card Accent Gradients -->
    <linearGradient id="gradRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="gradCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="gradMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="gradPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Clip Paths for All 4 Bento Cards -->
    <clipPath id="clip1"><rect x="2" y="2" width="514" height="168" rx="18"/></clipPath>
    <clipPath id="clip2"><rect x="530" y="2" width="318" height="168" rx="18"/></clipPath>
    <clipPath id="clip3"><rect x="2" y="184" width="417" height="174" rx="18"/></clipPath>
    <clipPath id="clip4"><rect x="433" y="184" width="415" height="174" rx="18"/></clipPath>
  </defs>

  <!-- CARD 01: VISUAL ARTIST x ENGINEER -->
  <g clip-path="url(#clip1)">
    <rect x="2" y="2" width="514" height="168" rx="18" fill="url(#glassCard)"/>
    <rect x="2" y="2" width="514" height="168" rx="18" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="26" y="2" width="128" height="3" rx="1.5" fill="url(#gradRose)"/>

    <text x="26" y="38" fill="#FB7185" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">01 // VISUAL ARTIST × ENGINEER</text>
    <text x="26" y="70" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="800">Crafting Interfaces With Intent</text>

    <text x="26" y="100" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.8" font-weight="500">As an artist &amp; Computer Science &amp; Technology student, I treat</text>
    <text x="26" y="122" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.8" font-weight="500">every screen as a canvas — blending clean architecture with</text>
    <text x="26" y="144" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.8" font-weight="600">modern motion, visual balance, and memorable user feel.</text>

    <!-- Animated Rhythm Bars (GitHub-Safe Native SVG Animate) -->
    <rect x="450" y="102" width="5" height="30" rx="2.5" fill="#F43F5E">
      <animate attributeName="height" values="14;32;14" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="118;100;118" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="460" y="96" width="5" height="36" rx="2.5" fill="#FB923C">
      <animate attributeName="height" values="36;16;36" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="96;116;96" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="470" y="100" width="5" height="32" rx="2.5" fill="#38BDF8">
      <animate attributeName="height" values="18;34;18" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="114;98;114" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="108" width="5" height="24" rx="2.5" fill="#34D399">
      <animate attributeName="height" values="28;12;28" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="104;120;104" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- CARD 02: CURRENT FOCUS -->
  <g clip-path="url(#clip2)">
    <rect x="530" y="2" width="318" height="168" rx="18" fill="url(#glassCard)"/>
    <rect x="530" y="2" width="318" height="168" rx="18" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="554" y="2" width="116" height="3" rx="1.5" fill="url(#gradCyan)"/>

    <!-- Pulsing Live Focus Indicator -->
    <circle cx="806" cy="42" r="9" fill="#38BDF8" fill-opacity="0.25">
      <animate attributeName="r" values="6;14;6" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="806" cy="42" r="4.5" fill="#38BDF8"/>

    <text x="554" y="38" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">02 // CURRENT FOCUS</text>
    <text x="554" y="70" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="800">React &amp; Modern UI</text>

    <!-- Focus Pills -->
    <rect x="554" y="88" width="98" height="28" rx="8" fill="#0C223B" stroke="#38BDF8" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="603" y="106" fill="#7DD3FC" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">React.js</text>

    <rect x="662" y="88" width="116" height="28" rx="8" fill="#131B36" stroke="#818CF8" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="720" y="106" fill="#C7D2FE" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">Tailwind CSS</text>

    <rect x="554" y="124" width="116" height="28" rx="8" fill="#1A1733" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="612" y="142" fill="#DDD6FE" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">JavaScript</text>

    <rect x="680" y="124" width="98" height="28" rx="8" fill="#1E1633" stroke="#C084FC" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="729" y="142" fill="#E9D5FF" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">Bootstrap</text>
  </g>

  <!-- CARD 03: CORE ENGINEERING & SYSTEMS -->
  <g clip-path="url(#clip3)">
    <rect x="2" y="184" width="417" height="174" rx="18" fill="url(#glassCard)"/>
    <rect x="2" y="184" width="417" height="174" rx="18" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="26" y="184" width="128" height="3" rx="1.5" fill="url(#gradMint)"/>

    <text x="26" y="218" fill="#34D399" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">03 // CORE ENGINEERING &amp; SYSTEMS</text>
    <text x="26" y="250" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">Strong CS Foundations</text>

    <!-- Blinking Terminal Cursor -->
    <rect x="256" y="233" width="9" height="19" rx="2" fill="#34D399">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Core Stack Pills -->
    <rect x="26" y="268" width="76" height="28" rx="8" fill="#1F1610" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="64" y="286" fill="#FCD34D" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">Java</text>

    <rect x="112" y="268" width="84" height="28" rx="8" fill="#0F1F2E" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="154" y="286" fill="#7DD3FC" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">Python</text>

    <rect x="206" y="268" width="54" height="28" rx="8" fill="#111C33" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="233" y="286" fill="#BFDBFE" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">C</text>

    <rect x="270" y="268" width="112" height="28" rx="8" fill="#1C1A0E" stroke="#FACC15" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="326" y="286" fill="#FEF08A" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">Linux OS</text>

    <rect x="26" y="306" width="144" height="28" rx="8" fill="#0B221D" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="98" y="324" fill="#A7F3D0" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">Git &amp; GitHub</text>

    <rect x="180" y="306" width="132" height="28" rx="8" fill="#181226" stroke="#F43F5E" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="246" y="324" fill="#FECDD3" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">HTML5 / CSS3</text>
  </g>

  <!-- CARD 04: CLOUD, AI & VISUAL DESIGN -->
  <g clip-path="url(#clip4)">
    <rect x="433" y="184" width="415" height="174" rx="18" fill="url(#glassCard)"/>
    <rect x="433" y="184" width="415" height="174" rx="18" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="457" y="184" width="128" height="3" rx="1.5" fill="url(#gradPurple)"/>

    <!-- Rotating Star Emblem -->
    <path d="M806 215 L808.8 223.2 L817 226 L808.8 228.8 L806 237 L803.2 228.8 L795 226 L803.2 223.2 Z" fill="#C084FC" fill-opacity="0.88">
      <animateTransform attributeName="transform" type="rotate" from="0 806 226" to="360 806 226" dur="12s" repeatCount="indefinite"/>
    </path>

    <text x="457" y="218" fill="#C084FC" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">04 // FUTURE WORKFLOWS</text>
    <text x="457" y="250" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">Cloud, AI &amp; Visual Design</text>

    <text x="457" y="282" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.8" font-weight="500">Combining artistic intuition with modern Cloud tools</text>
    <text x="457" y="304" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.8" font-weight="500">and AI-augmented workflows to ship faster &amp; smarter.</text>

    <circle cx="463" cy="330" r="4" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="475" y="334" fill="#34D399" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="0.8">OPEN TO CREATIVE COLLABORATIONS</text>
  </g>
</svg>
