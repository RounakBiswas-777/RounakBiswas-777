<svg width="850" height="360" viewBox="0 0 850 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#080C17" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="gradRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="gradCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="gradMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="gradPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="cardSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardSheenRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FB7185" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clip1"><rect x="2" y="2" width="514" height="168" rx="18"/></clipPath>
    <clipPath id="clip2"><rect x="530" y="2" width="318" height="168" rx="18"/></clipPath>
    <clipPath id="clip3"><rect x="2" y="184" width="417" height="174" rx="18"/></clipPath>
    <clipPath id="clip4"><rect x="433" y="184" width="415" height="174" rx="18"/></clipPath>
  </defs>

  <style>
    /* Staggered Card Entrance Transitions */
    .c-in-1 { animation: cardRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both; }
    .c-in-2 { animation: cardRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both; }
    .c-in-3 { animation: cardRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both; }
    .c-in-4 { animation: cardRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both; }

    /* Offset Diagonal Glass Shimmer Sweeps */
    .sweep-1 { animation: shimmerSlide 6.8s ease-in-out 0.8s infinite; }
    .sweep-2 { animation: shimmerSlide 6.8s ease-in-out 2.5s infinite; }
    .sweep-3 { animation: shimmerSlide 6.8s ease-in-out 4.1s infinite; }
    .sweep-4 { animation: shimmerSlide 6.8s ease-in-out 5.6s infinite; }

    /* Card 01 Equalizer */
    .bar-1 { transform-origin: 452px 132px; animation: eqPulse 1.5s ease-in-out infinite; }
    .bar-2 { transform-origin: 462px 132px; animation: eqPulse 1.2s ease-in-out 0.2s infinite; }
    .bar-3 { transform-origin: 472px 132px; animation: eqPulse 1.7s ease-in-out 0.4s infinite; }
    .bar-4 { transform-origin: 482px 132px; animation: eqPulse 1.3s ease-in-out 0.1s infinite; }

    /* Card 02 Double Radar Pulse + Active React Pill Glow */
    .pulse-ring-a { transform-origin: 806px 42px; animation: ringBeat 2.4s ease-out infinite; }
    .pulse-ring-b { transform-origin: 806px 42px; animation: ringBeat 2.4s ease-out 1.2s infinite; }
    .react-glow { animation: pillPulse 2.8s ease-in-out infinite; }

    /* Card 03 Blinking Terminal Cursor */
    .cursor-blink { animation: blink 1.05s steps(2, start) infinite; }

    /* Card 04 Twinkling Artist Stars & Live Status Dot */
    .star-spin { transform-origin: 806px 226px; animation: spinStar 12s linear infinite; }
    .dot-live { animation: dotPulse 2s ease-in-out infinite; }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmerSlide {
      0% { transform: translateX(-260px) skewX(-24deg); opacity: 0; }
      20% { opacity: 1; }
      48% { transform: translateX(760px) skewX(-24deg); opacity: 1; }
      55%, 100% { transform: translateX(760px) skewX(-24deg); opacity: 0; }
    }
    @keyframes eqPulse {
      0%, 100% { transform: scaleY(0.38); opacity: 0.65; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    @keyframes ringBeat {
      0% { transform: scale(0.65); opacity: 0.9; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    @keyframes pillPulse {
      0%, 100% { stroke-opacity: 0.45; }
      50% { stroke-opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes spinStar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- CARD 01: ARTIST x ENGINEER PHILOSOPHY -->
  <g class="c-in-1">
    <g clip-path="url(#clip1)">
      <rect x="2" y="2" width="514" height="168" rx="18" fill="url(#glassCard)"/>
      <rect class="sweep-1" x="2" y="2" width="150" height="168" fill="url(#cardSheenRose)"/>
    </g>
    <rect x="2" y="2" width="514" height="168" rx="18" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="26" y="2" width="128" height="3" rx="1.5" fill="url(#gradRose)"/>

    <text x="26" y="38" fill="#FB7185" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">01 // VISUAL ARTIST × ENGINEER</text>
    <text x="26" y="70" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="800">Crafting Interfaces With Intent</text>
    <text x="26" y="100" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13.8" font-weight="500">As an artist &amp; Computer Science &amp; Technology student, I treat</text>
    <text x="26" y="122" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13.8" font-weight="500">every screen as a canvas — blending clean architecture with</text>
    <text x="26" y="144" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="13.8" font-weight="600">modern motion, visual balance, and memorable user feel.</text>

    <rect class="bar-1" x="450" y="106" width="5" height="26" rx="2.5" fill="#F43F5E"/>
    <rect class="bar-2" x="460" y="96" width="5" height="36" rx="2.5" fill="#FB923C"/>
    <rect class="bar-3" x="470" y="102" width="5" height="30" rx="2.5" fill="#38BDF8"/>
    <rect class="bar-4" x="480" y="110" width="5" height="22" rx="2.5" fill="#34D399"/>
  </g>

  <!-- CARD 02: CURRENT FOCUS -->
  <g class="c-in-2">
    <g clip-path="url(#clip2)">
      <rect x="530" y="2" width="318" height="168" rx="18" fill="url(#glassCard)"/>
      <rect class="sweep-2" x="530" y="2" width="130" height="168" fill="url(#cardSheen)"/>
    </g>
    <rect x="530" y="2" width="318" height="168" rx="18" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="554" y="2" width="116" height="3" rx="1.5" fill="url(#gradCyan)"/>

    <circle class="pulse-ring-a" cx="806" cy="42" r="9" fill="#38BDF8" fill-opacity="0.32"/>
    <circle class="pulse-ring-b" cx="806" cy="42" r="9" fill="#38BDF8" fill-opacity="0.24"/>
    <circle cx="806" cy="42" r="4.5" fill="#38BDF8"/>

    <text x="554" y="38" fill="#38BDF8" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">02 // CURRENT FOCUS</text>
    <text x="554" y="70" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="800">React &amp; Modern UI</text>

    <rect class="react-glow" x="554" y="88" width="98" height="28" rx="8" fill="#0C223B" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="603" y="106" fill="#7DD3FC" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">React.js</text>

    <rect x="662" y="88" width="116" height="28" rx="8" fill="#131B36" stroke="#818CF8" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="720" y="106" fill="#C7D2FE" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">Tailwind CSS</text>

    <rect x="554" y="124" width="116" height="28" rx="8" fill="#1A1733" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="612" y="142" fill="#DDD6FE" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">JavaScript</text>

    <rect x="680" y="124" width="98" height="28" rx="8" fill="#1E1633" stroke="#C084FC" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="729" y="142" fill="#E9D5FF" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">Bootstrap</text>
  </g>

  <!-- CARD 03: CORE ENGINEERING & SYSTEMS -->
  <g class="c-in-3">
    <g clip-path="url(#clip3)">
      <rect x="2" y="184" width="417" height="174" rx="18" fill="url(#glassCard)"/>
      <rect class="sweep-3" x="2" y="184" width="140" height="174" fill="url(#cardSheen)"/>
    </g>
    <rect x="2" y="184" width="417" height="174" rx="18" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="26" y="184" width="128" height="3" rx="1.5" fill="url(#gradMint)"/>

    <text x="26" y="218" fill="#34D399" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">03 // CORE ENGINEERING &amp; SYSTEMS</text>
    <text x="26" y="250" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">Strong CS Foundations</text>
    <rect class="cursor-blink" x="256" y="233" width="9" height="19" rx="2" fill="#34D399"/>

    <rect x="26" y="268" width="76" height="28" rx="8" fill="#1F1610" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="64" y="286" fill="#FCD34D" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">Java</text>

    <rect x="112" y="268" width="84" height="28" rx="8" fill="#0F1F2E" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="154" y="286" fill="#7DD3FC" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">Python</text>

    <rect x="206" y="268" width="54" height="28" rx="8" fill="#111C33" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="233" y="286" fill="#BFDBFE" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">C</text>

    <rect x="270" y="268" width="112" height="28" rx="8" fill="#1C1A0E" stroke="#FACC15" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="326" y="286" fill="#FEF08A" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">Linux OS</text>

    <rect x="26" y="306" width="144" height="28" rx="8" fill="#0B221D" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="98" y="324" fill="#A7F3D0" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">Git &amp; GitHub</text>

    <rect x="180" y="306" width="132" height="28" rx="8" fill="#181226" stroke="#F43F5E" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="246" y="324" fill="#FECDD3" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">HTML5 / CSS3</text>
  </g>

  <!-- CARD 04: CLOUD, AI & VISUAL DESIGN -->
  <g class="c-in-4">
    <g clip-path="url(#clip4)">
      <rect x="433" y="184" width="415" height="174" rx="18" fill="url(#glassCard)"/>
      <rect class="sweep-4" x="433" y="184" width="140" height="174" fill="url(#cardSheenRose)"/>
    </g>
    <rect x="433" y="184" width="415" height="174" rx="18" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="457" y="184" width="128" height="3" rx="1.5" fill="url(#gradPurple)"/>

    <g class="star-spin">
      <path d="M806 215 L808.8 223.2 L817 226 L808.8 228.8 L806 237 L803.2 228.8 L795 226 L803.2 223.2 Z" fill="#C084FC" fill-opacity="0.85"/>
    </g>

    <text x="457" y="218" fill="#C084FC" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">04 // FUTURE WORKFLOWS</text>
    <text x="457" y="250" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">Cloud, AI &amp; Visual Design</text>
    <text x="457" y="282" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13.8" font-weight="500">Combining artistic intuition with modern Cloud tools</text>
    <text x="457" y="304" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13.8" font-weight="500">and AI-augmented workflows to ship faster &amp; smarter.</text>

    <circle class="dot-live" cx="463" cy="330" r="4" fill="#34D399"/>
    <text x="475" y="334" fill="#34D399" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.8">OPEN TO CREATIVE COLLABORATIONS</text>
  </g>
</svg>